repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v2.1.1
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        language: system
        entry: tox -e py312
        pass_filenames: false
        always_run: true
      - id: lint
        name: lint
        language: system
        entry: tox -e lint
        pass_filenames: false
        always_run: true
      - id: format
        name: format
        language: system
        entry: tox -e lint
        pass_filenames: false
        always_run: true
      - id: type
        name: type
        language: system
        entry: tox -e type
        pass_filenames: false
        always_run: true

