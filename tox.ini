[tox]
minversion = 4
requires = tox-uv
no_header = true
env_list = lint, format, type, py310, py311, py312, py313, py314

# Base env: uv sync from uv.lock, dev group, package NOT installed —
# pytest finds xlsx2html in the tree via pythonpath (pyproject
# [tool.pytest.ini_options]). doctests run via addopts (--doctest-modules).
[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
package = skip
passenv =
    {tox_env_passenv}
    GITHUB_ACTIONS

[testenv:lint]
description = ruff check --fix
commands = ruff check --fix {posargs}

[testenv:format]
description = ruff format --check
commands =
  ruff format {posargs}
  ruff format --check {posargs}

[testenv:type]
description = mypy (basic; strict deferred — see [tool.mypy] TODO)
commands = mypy xlsx2html {posargs}

[testenv:py310]
description = pytest on Python 3.10
python = 3.10
commands = pytest --skip-webtest {posargs}

[testenv:py311]
description = pytest on Python 3.11
python = 3.11
commands = pytest --skip-webtest {posargs}

[testenv:py312]
description = pytest on Python 3.12
python = 3.12
commands = pytest --skip-webtest {posargs}

[testenv:py313]
description = pytest on Python 3.13
python = 3.13
commands = pytest --skip-webtest {posargs}

[testenv:py314]
description = pytest on Python 3.13
python = 3.14
commands = pytest --skip-webtest {posargs}

[testenv:py315]
description = pytest on Python 3.15
python = 3.15
commands = pytest --skip-webtest {posargs}

[testenv:pypy311]
description = pytest on PyPy 3.11
python = pypy3.11
commands = pytest --skip-webtest {posargs}

[testenv:webtest]
description = browser tests (playwright), manual
dependency_groups = webtest
python = 3.12
commands = pytest -m webtest {posargs}
