[tox]
minversion = 4
requires = tox-uv
no_header = true
env_list = lint, format, type, py310, py311, py312, py313

# Base env: uv sync from uv.lock, dev group, package NOT installed —
# pytest finds xlsx2html in the tree via pythonpath (pyproject
# [tool.pytest.ini_options]). doctests run via addopts (--doctest-modules).
[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
package = skip
passenv =
    {tox_env_passenv}
    GITHUB_ACTIONS

[testenv:lint]
description = ruff check
commands = ruff check {posargs}

[testenv:format]
description = ruff format --check
commands = ruff format --check {posargs}

[testenv:type]
description = mypy (basic; strict deferred — see [tool.mypy] TODO)
commands = mypy xlsx2html {posargs}

[testenv:py310]
description = pytest on Python 3.10
python = 3.10
commands = pytest --skip-webtest {posargs}

[testenv:py311]
description = pytest on Python 3.11
python = 3.11
commands = pytest --skip-webtest {posargs}

[testenv:py312]
description = pytest on Python 3.12
python = 3.12
commands = pytest --skip-webtest {posargs}

[testenv:py313]
description = pytest on Python 3.13
python = 3.13
commands = pytest --skip-webtest {posargs}

# Browser (splinter/chromedriver) tests — manual, OUTSIDE env_list:
#   tox -e webtest
# Runs only the webtest-marked tests (tests are not modified).
[testenv:webtest]
description = browser tests (splinter + chromedriver), manual
python = 3.12
deps =
    pytest-splinter>=3.3
    splinter>=0.21,<0.22
    chromedriver-binary-auto
    pytest-image-diff
    Pillow
commands = pytest -m webtest {posargs}
